name: Build & publish ma04 docker images
on:
  release:
    types: [published]
  push:
    branches:
      - 'main'
  workflow_dispatch:
  schedule:
    - cron: "1 0 1 * *"
    
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./hydroxide/Dockerfile
            ghcr_image: ghcr.io/ma-04/hydroxide
            dockerhub_image: ma04/hydroxide
          - dockerfile: ./base-ubuntu/Dockerfile
            ghcr_image: ghcr.io/ma-04/ubuntu
            dockerhub_image: ma04/ubuntu
    permissions:
      contents: read
      packages: write

    steps:
      - 
        name: Checkout repository
        uses: actions/checkout@v2

      -
        name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ma-04
          password: ${{ secrets.GH_PACKAGE_TOKEN }}

      - 
        name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - 
        name: Build and push image to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.ghcr_image }}
            ${{ matrix.dockerhub_image }}
          platforms: linux/amd64,linux/arm64