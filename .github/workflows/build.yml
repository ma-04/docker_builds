name: Build & publish ma04 docker images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monthly: rebuild everything on fresh base images and refresh hydroxide :dev from upstream master
    - cron: "1 0 1 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true

  build:
    name: Build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hydroxide
            context: ./hydroxide
          - name: ubuntu
            context: ./base-ubuntu
    uses: ./.github/workflows/docker-image.yml
    with:
      name: ${{ matrix.name }}
      context: ${{ matrix.context }}
      push: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  # hydroxide built from upstream master -> :dev (monthly or on manual dispatch)
  build-hydroxide-master:
    name: Build hydroxide (upstream master)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      name: hydroxide
      context: ./hydroxide
      variant: dev
      build-args: HYDROXIDE_VERSION=master
    secrets: inherit
