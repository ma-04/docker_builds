name: Build docker image (reusable)

# Reusable job: builds one multi-arch image and pushes it to GHCR
# (and Docker Hub when the DOCKERHUB_NAMESPACE repo variable is set).
#
# Tagging:
#   variant == ""  -> "stable" build from the pinned version in the Dockerfile:
#                     latest, <version>, <major.minor>, sha-<short>
#   variant != ""  -> a single moving tag named after the variant (e.g. "dev")

on:
  workflow_call:
    inputs:
      name:
        description: Image name (without registry / namespace)
        required: true
        type: string
      context:
        description: Build context directory (must contain the Dockerfile)
        required: true
        type: string
      build-args:
        description: Extra build args, one KEY=value per line
        required: false
        type: string
        default: ""
      variant:
        description: Non-empty for a moving-tag build (tag name), empty for a stable build
        required: false
        type: string
        default: ""
      push:
        description: Push to registries (false for pull requests)
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: ${{ inputs.name }}${{ inputs.variant != '' && format(' ({0})', inputs.variant) || '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read pinned version from Dockerfile
        id: version
        shell: bash
        run: |
          # The first `ARG <NAME>_VERSION=<value>` line in the Dockerfile is the
          # single source of truth for the version tag of a stable build.
          line=$(grep -m1 -E '^ARG [A-Z_]+_VERSION=' "${{ inputs.context }}/Dockerfile" || true)
          version="${line#*=}"
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "minor=" >> "$GITHUB_OUTPUT"
          fi
          echo "Pinned version: '${version}'"

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ inputs.push && vars.DOCKERHUB_NAMESPACE != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            name=ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}
            name=${{ vars.DOCKERHUB_NAMESPACE }}/${{ inputs.name }},enable=${{ vars.DOCKERHUB_NAMESPACE != '' }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ inputs.variant == '' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ inputs.variant == '' && steps.version.outputs.version != '' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ inputs.variant == '' && steps.version.outputs.minor != '' }}
            type=sha,format=short,enable=${{ inputs.variant == '' }}
            type=raw,value=${{ inputs.variant }},enable=${{ inputs.variant != '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          build-args: ${{ inputs.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ inputs.name }}-${{ inputs.variant || 'stable' }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}-${{ inputs.variant || 'stable' }}
          provenance: false
